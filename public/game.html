<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bingo Game</title>

<script src="/socket.io/socket.io.js"></script>

<script defer src="client.js"></script>

<style>

body{
background:#111;
color:#fff;
font-family:Arial,sans-serif;
text-align:center;
margin:0;
padding:20px;
}

h1{
margin-bottom:10px;
}

#countdown{
font-size:28px;
color:yellow;
margin-bottom:20px;
}

#last{
font-size:40px;
font-weight:bold;
color:#00ff00;
margin:20px;
}

#card{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:5px;
}

button{
padding:8px;
border:none;
cursor:pointer;
border-radius:5px;
}

.num{
display:inline-block;
background:#333;
padding:6px;
margin:2px;
border-radius:4px;
min-width:35px;
}

.selected{
background:green;
}

</style>

</head>

<body>

<h1>🎯 ETHIO BINGO</h1>

<h2 id="countdown">Waiting...</h2>

<h2>Last Called Number</h2>

<div id="last">-</div>

<h2>Choose Cartela</h2>

<div id="card"></div>

</body>
</html>
