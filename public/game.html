<!DOCTYPE html>
<html>
<head>
  <title>Bingo Game</title>
  <script src="/socket.io/socket.io.js"></script>
  <script defer src="client.js"></script>
  <style>
    body { font-family: Arial; background:#111; color:#fff; }
    .grid { display:grid; grid-template-columns:repeat(20,1fr); gap:5px; }
    .card { border:1px solid #444; padding:5px; font-size:10px; }
    .number { padding:5px; background:#222; margin:2px; display:inline-block; }
  </style>
</head>
<body>

<h2>🎯 LIVE BINGO</h2>

<h3>Called Numbers:</h3>
<div id="called"></div>

<h3>Cards (600):</h3>
<div id="cards" class="grid"></div>

</body>
</html>
