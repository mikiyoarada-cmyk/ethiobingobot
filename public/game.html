<!DOCTYPE html>
<html>

<head>

<title>Ethio Bingo</title>

<script src="/socket.io/socket.io.js"></script>
<script defer src="client.js"></script>


<style>

body{

background:#111;
color:white;
font-family:Arial;
text-align:center;

}


#countdown{

font-size:30px;
color:yellow;

}


#last{

font-size:55px;
color:yellow;

}


#calledNumbers{

background:#222;
padding:15px;
margin:10px;
border-radius:10px;
font-size:20px;

}



#cartelas{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:20px;

}



.cartela{

background:#222;
padding:10px;
border:2px solid gray;
border-radius:10px;

}



.cartela:hover{

border-color:yellow;

}



table{

border-collapse:collapse;
margin:auto;

}



td,th{

width:35px;
height:35px;
border:1px solid white;
text-align:center;

}



th{

background:red;

}



.marked{

background:green;
color:white;
font-weight:bold;

}



.free{

background:blue;
color:white;
font-weight:bold;

}



button{

padding:12px;
font-size:18px;
margin:10px;

}



#winner{

font-size:30px;
color:lime;

}



</style>

</head>



<body>



<h1>🎯 ETHIO BINGO</h1>



<h2 id="countdown">

Waiting...

</h2>




<button id="enableSound">

🔊 ENABLE SOUND

</button>




<h2>Current Called Number</h2>


<div id="last">

-

</div>




<h2>All Called Numbers</h2>


<div id="calledNumbers">

</div>




<h2 id="winner"></h2>




<h2>600 Cartelas</h2>


<div id="cartelas"></div>





<h2>Your Selected Cartelas</h2>


<div id="mycard"></div>




</body>


</html>
