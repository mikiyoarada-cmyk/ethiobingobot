<!DOCTYPE html>
<html>
<head>

<title>Ethio Bingo</title>

<script src="/socket.io/socket.io.js"></script>
<script defer src="client.js"></script>

<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}


#cartelas{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:20px;

}


.cartela{

background:#222;
border:2px solid #555;
border-radius:10px;
padding:10px;
cursor:pointer;

}


.cartela:hover{

background:#006600;

}


.title{

font-size:18px;
color:yellow;
margin-bottom:8px;

}


.bingo{

display:grid;
grid-template-columns:repeat(5,35px);
gap:2px;
justify-content:center;

}



.cell{

background:#333;
padding:7px 0;
font-weight:bold;

}


.letter{

background:red;
color:white;

}



#mycard{

margin:20px;

}


#last{

font-size:40px;
color:lime;

}


</style>

</head>


<body>


<h1>🎯 ETHIO BINGO</h1>


<h2 id="countdown">
Waiting...
</h2>


<h2>
Called Number
</h2>


<div id="last">
-
</div>


<h2>
Choose Cartela
</h2>


<div id="cartelas"></div>



<h2>
Your Cartela
</h2>


<div id="mycard"></div>


</body>

</html>
