<!DOCTYPE html>
<html>

<head>

<title>Ethio Bingo</title>

<script src="/socket.io/socket.io.js"></script>
<script defer src="client.js"></script>


<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}


h1{
color:gold;
}


#countdown{
color:yellow;
font-size:30px;
}


#last{
font-size:55px;
color:red;
font-weight:bold;
}


#calledNumbers{

background:#222;
padding:15px;
margin:15px;
border-radius:10px;
font-size:20px;

}



#cartelas{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:15px;

}



.cartela{

background:#222;
border:2px solid gray;
border-radius:10px;
padding:10px;
cursor:pointer;

}


.cartela:hover{

border-color:yellow;

}



table{

border-collapse:collapse;
margin:auto;

}



td,th{

width:35px;
height:35px;
border:1px solid white;
text-align:center;

}



th{

background:red;

}



.marked{

background:green;
color:white;
font-weight:bold;

}



.free{

background:blue;
color:white;
font-weight:bold;

}



button{

font-size:18px;
padding:12px 20px;
background:green;
color:white;
border:none;
border-radius:8px;

}



#mycard{

margin:30px;

}


</style>

</head>


<body>


<h1>🎯 ETHIO BINGO</h1>


<h2 id="countdown">
Waiting...
</h2>


<button id="enableSound">
🔊 ENABLE SOUND
</button>



<h2>Current Called Number</h2>


<div id="last">
-
</div>



<h2>All Called Numbers</h2>


<div id="calledNumbers">
None
</div>



<h2>600 CARTELAS</h2>


<div id="cartelas"></div>



<h2>Your Selected Cartelas</h2>


<div id="mycard"></div>



</body>

</html>
