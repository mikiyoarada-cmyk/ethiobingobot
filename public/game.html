<!DOCTYPE html>
<html>

<head>

<title>Ethio Bingo</title>

<script src="/socket.io/socket.io.js"></script>
<script defer src="client.js"></script>


<style>

body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}


#cartelas{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:20px;

}


.cartela{

background:#222;
padding:10px;
border:2px solid gray;
border-radius:10px;

}


table{

margin:auto;
border-collapse:collapse;

}


td,th{

width:35px;
height:35px;
text-align:center;
border:1px solid white;

}


th{

background:red;

}


#last{

font-size:45px;
color:yellow;

}


</style>


</head>


<body>


<h1>🎯 ETHIO BINGO</h1>


<h2 id="countdown"></h2>


<h2>Called Number</h2>

<div id="last">-</div>



<h2>600 Cartelas</h2>


<div id="cartelas"></div>



<h2>Your Selected Cartela</h2>


<div id="mycard"></div>



</body>

</html>
