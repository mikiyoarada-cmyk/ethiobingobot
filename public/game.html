<!DOCTYPE html>
<html>
<head>
<title>Ethio Bingo</title>

<script src="/socket.io/socket.io.js"></script>
<script defer src="client.js"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
}

#cartelas{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:8px;
padding:20px;
}

.cartela{
background:#222;
padding:15px;
border-radius:5px;
cursor:pointer;
}

.cartela:hover{
background:green;
}

#mycard{
margin:20px;
}

.num{
display:inline-block;
background:#333;
padding:8px;
margin:3px;
}

#last{
font-size:40px;
color:yellow;
}

#countdown{
font-size:30px;
color:red;
}
</style>

</head>

<body>

<h1>🎯 ETHIO BINGO</h1>

<h2 id="countdown">Starting...</h2>

<h2>Last Called Number</h2>

<div id="last">-</div>


<h2>Select Your Cartela</h2>

<div id="cartelas"></div>


<h2>Your Cartela</h2>

<div id="mycard"></div>


</body>
</html>
